[project]
name = "customer-support-agent"
version = "0.1.0"
description = "LangGraph customer support agent deployed to Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-aws>=0.2.0",
    "langchain-core>=0.3.0",
    "bedrock-agentcore",
    "fastapi>=0.141.1",
]

# Only needed for local_api.py (manual testing without AgentCore) — not
# required by the deployed agent itself, so kept out of the core deps.
[project.optional-dependencies]
local = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[dependency-groups]
dev = [
    "bedrock-agentcore-starter-toolkit>=0.3.12",
]
